<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Data Fuel desktop">
  <defs>
    <linearGradient id="mapBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#f4f8fc"/>

  <!-- Header -->
  <rect x="0" y="0" width="1280" height="72" fill="#ffffff"/>
  <line x1="0" y1="72" x2="1280" y2="72" stroke="#e2e8f0" stroke-width="1"/>
  <text x="32" y="46" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="22" font-weight="800" fill="#0b1220">⛽ Data <tspan fill="#2563eb">Fuel</tspan></text>
  <rect x="180" y="22" width="80" height="28" rx="14" fill="#dcfce7"/>
  <text x="220" y="40" font-family="system-ui" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">v0.1.0 OK</text>

  <!-- Search bar -->
  <rect x="320" y="22" width="640" height="28" rx="14" fill="#f1f5f9"/>
  <text x="340" y="41" font-family="system-ui" font-size="13" fill="#64748b">🔍  Madrid, España</text>

  <!-- Right header icons -->
  <circle cx="1180" cy="36" r="14" fill="#f1f5f9"/>
  <text x="1180" y="40" font-family="system-ui" font-size="14" fill="#475569" text-anchor="middle">🌙</text>
  <circle cx="1220" cy="36" r="14" fill="#f1f5f9"/>
  <text x="1220" y="41" font-family="system-ui" font-size="14" fill="#475569" text-anchor="middle">⚙</text>

  <!-- Sidebar -->
  <rect x="0" y="72" width="380" height="648" fill="#ffffff"/>
  <line x1="380" y1="72" x2="380" y2="720" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Smart advice card -->
  <rect x="16" y="92" width="348" height="120" rx="16" fill="url(#cardGrad)" stroke="#e2e8f0"/>
  <rect x="16" y="92" width="348" height="32" rx="16" fill="#2563eb"/>
  <text x="32" y="113" font-family="system-ui" font-size="12" font-weight="700" fill="#ffffff">💡 RECOMENDACIÓN INTELIGENTE</text>
  <text x="32" y="148" font-family="system-ui" font-size="14" font-weight="600" fill="#0b1220">Ahorra 4,80 € en Repsol</text>
  <text x="32" y="170" font-family="system-ui" font-size="12" fill="#64748b">A 2,3 km · Gasoil 1,389 €/L</text>
  <text x="32" y="190" font-family="system-ui" font-size="11" fill="#16a34a">↓ 12% vs precio medio zona</text>

  <!-- Station rows -->
  <g font-family="system-ui">
    <rect x="16" y="228" width="348" height="76" rx="14" fill="#ecfdf5" stroke="#86efac"/>
    <circle cx="44" cy="266" r="18" fill="#16a34a"/>
    <text x="44" y="271" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
    <text x="74" y="256" font-size="14" font-weight="700" fill="#0b1220">REPSOL</text>
    <text x="74" y="274" font-size="11" fill="#64748b">Av. Castilla 12 · 2,3 km</text>
    <text x="350" y="260" font-size="13" font-weight="700" fill="#0b1220" text-anchor="end">73,40 €</text>
    <text x="350" y="278" font-size="10" fill="#16a34a" text-anchor="end">Mejor opción</text>

    <rect x="16" y="316" width="348" height="68" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="44" cy="350" r="18" fill="#3b82f6"/>
    <text x="44" y="355" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
    <text x="74" y="342" font-size="14" font-weight="700" fill="#0b1220">CEPSA</text>
    <text x="74" y="360" font-size="11" fill="#64748b">Calle Mayor 8 · 3,1 km</text>
    <text x="350" y="354" font-size="13" font-weight="700" fill="#0b1220" text-anchor="end">75,10 €</text>

    <rect x="16" y="396" width="348" height="68" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="44" cy="430" r="18" fill="#f59e0b"/>
    <text x="44" y="435" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
    <text x="74" y="422" font-size="14" font-weight="700" fill="#0b1220">BP</text>
    <text x="74" y="440" font-size="11" fill="#64748b">Glorieta Sol · 4,5 km</text>
    <text x="350" y="434" font-size="13" font-weight="700" fill="#0b1220" text-anchor="end">76,20 €</text>

    <rect x="16" y="476" width="348" height="68" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="44" cy="510" r="18" fill="#ef4444"/>
    <text x="44" y="515" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
    <text x="74" y="502" font-size="14" font-weight="700" fill="#0b1220">SHELL</text>
    <text x="74" y="520" font-size="11" fill="#64748b">Paseo Recoletos 22 · 5,8 km</text>
    <text x="350" y="514" font-size="13" font-weight="700" fill="#0b1220" text-anchor="end">78,30 €</text>
  </g>

  <!-- Map area -->
  <rect x="380" y="72" width="900" height="648" fill="url(#mapBg)"/>

  <!-- Map roads -->
  <g stroke="#cbd5e1" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 380 280 Q 700 320 1280 250"/>
    <path d="M 380 480 Q 700 420 1280 460"/>
    <path d="M 600 72 L 620 720"/>
    <path d="M 980 72 L 960 720"/>
  </g>

  <!-- Search radius circle -->
  <circle cx="830" cy="396" r="220" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 6" opacity="0.4"/>
  <circle cx="830" cy="396" r="220" fill="#2563eb" opacity="0.05"/>

  <!-- User position -->
  <circle cx="830" cy="396" r="14" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
  <circle cx="830" cy="396" r="6" fill="#ffffff"/>

  <!-- Station pins -->
  <g font-family="system-ui">
    <g transform="translate(710, 320)">
      <path d="M 0 0 C -14 -14 -14 -32 0 -42 C 14 -32 14 -14 0 0 Z" fill="#16a34a"/>
      <text y="-22" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
    </g>
    <g transform="translate(940, 280)">
      <path d="M 0 0 C -14 -14 -14 -32 0 -42 C 14 -32 14 -14 0 0 Z" fill="#3b82f6"/>
      <text y="-22" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
    </g>
    <g transform="translate(680, 510)">
      <path d="M 0 0 C -14 -14 -14 -32 0 -42 C 14 -32 14 -14 0 0 Z" fill="#f59e0b"/>
      <text y="-22" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
    </g>
    <g transform="translate(1020, 470)">
      <path d="M 0 0 C -14 -14 -14 -32 0 -42 C 14 -32 14 -14 0 0 Z" fill="#ef4444"/>
      <text y="-22" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
    </g>
  </g>

  <!-- Floating caption -->
  <rect x="430" y="640" width="800" height="60" rx="16" fill="#0b1220" opacity="0.85"/>
  <text x="830" y="668" font-family="Plus Jakarta Sans, system-ui" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Compara precio · distancia · consumo real</text>
  <text x="830" y="688" font-family="system-ui" font-size="12" fill="#cbd5e1" text-anchor="middle">La gasolinera más rentable según tu coche</text>
</svg>
