# nginx site config for the Data Fuel SPA bundle.
#
# - Static assets are served straight from /usr/share/nginx/html with a long
#   cache header (Vite emits hashed filenames).
# - /api/ is reverse-proxied to the backend service over the compose
#   network (DNS name "backend" resolves to the FastAPI container).
# - Anything else falls through to /index.html so React Router deep links
#   resolve client-side instead of returning 404.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Defence in depth — Nginx already strips most, but be explicit.
    server_tokens off;

    # Compression for text-y payloads only; binary assets are already encoded.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Long-lived cache for hashed Vite assets.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp|avif|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse proxy to FastAPI inside the compose network.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA fallback: React Router owns deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
