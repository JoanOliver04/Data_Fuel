name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same ref when a new push arrives — saves
# minutes on rapid-fire commits without losing the run that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; jobs that need elevated scopes must opt in explicitly.
permissions:
  contents: read

jobs:
  backend:
    name: Backend · ruff + mypy + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff · lint and import order
        run: ruff check .

      - name: Mypy · strict static type check
        run: mypy app

      - name: Pytest · unit + integration with 80 % coverage gate
        run: pytest -q

  frontend:
    name: Frontend · eslint + vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: ESLint · zero warnings allowed
        run: npm run lint

      - name: Vitest · component + hook tests (single run)
        run: npx vitest run

      - name: TypeScript + Vite production build
        run: npm run build
