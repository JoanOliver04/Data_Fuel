<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280" role="img" aria-label="Data Fuel mobile">
  <defs>
    <linearGradient id="mapBg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1280" fill="#f4f8fc"/>

  <!-- Status bar -->
  <rect x="0" y="0" width="720" height="44" fill="#ffffff"/>
  <text x="40" y="28" font-family="system-ui" font-size="14" font-weight="700" fill="#0b1220">9:41</text>
  <text x="680" y="28" font-family="system-ui" font-size="13" fill="#0b1220" text-anchor="end">100%</text>

  <!-- Header -->
  <rect x="0" y="44" width="720" height="172" fill="#ffffff"/>
  <line x1="0" y1="216" x2="720" y2="216" stroke="#e2e8f0" stroke-width="1"/>
  <text x="32" y="92" font-family="Plus Jakarta Sans, system-ui" font-size="26" font-weight="800" fill="#0b1220">⛽ Data <tspan fill="#2563eb">Fuel</tspan></text>
  <rect x="240" y="74" width="86" height="26" rx="13" fill="#dcfce7"/>
  <text x="283" y="91" font-family="system-ui" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">v0.1.0 OK</text>

  <circle cx="640" cy="84" r="18" fill="#dbeafe"/>
  <text x="640" y="89" font-family="system-ui" font-size="16" fill="#2563eb" text-anchor="middle">📱</text>
  <text x="616" y="89" font-family="system-ui" font-size="9" font-weight="800" fill="#2563eb" text-anchor="end">APP</text>

  <!-- Search bar -->
  <rect x="32" y="124" width="656" height="44" rx="22" fill="#f1f5f9"/>
  <text x="56" y="151" font-family="system-ui" font-size="15" fill="#64748b">🔍  Madrid, España</text>

  <!-- Filter chips -->
  <g font-family="system-ui">
    <rect x="32" y="180" width="80" height="28" rx="14" fill="#2563eb"/>
    <text x="72" y="199" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Gasoil</text>

    <rect x="120" y="180" width="92" height="28" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="166" y="199" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">5 km radio</text>

    <rect x="220" y="180" width="100" height="28" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="270" y="199" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Abierto ahora</text>
  </g>

  <!-- Map area -->
  <rect x="0" y="216" width="720" height="640" fill="url(#mapBg2)"/>

  <g stroke="#cbd5e1" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 0 380 Q 360 420 720 360"/>
    <path d="M 0 600 Q 360 540 720 580"/>
    <path d="M 240 216 L 260 856"/>
    <path d="M 540 216 L 520 856"/>
  </g>

  <!-- Search radius -->
  <circle cx="360" cy="540" r="240" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 6" opacity="0.4"/>
  <circle cx="360" cy="540" r="240" fill="#2563eb" opacity="0.05"/>

  <circle cx="360" cy="540" r="16" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
  <circle cx="360" cy="540" r="6" fill="#ffffff"/>

  <!-- Pins -->
  <g font-family="system-ui">
    <g transform="translate(280, 440)">
      <path d="M 0 0 C -16 -16 -16 -38 0 -50 C 16 -38 16 -16 0 0 Z" fill="#16a34a"/>
      <text y="-26" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
    </g>
    <g transform="translate(480, 400)">
      <path d="M 0 0 C -16 -16 -16 -38 0 -50 C 16 -38 16 -16 0 0 Z" fill="#3b82f6"/>
      <text y="-26" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
    </g>
    <g transform="translate(260, 660)">
      <path d="M 0 0 C -16 -16 -16 -38 0 -50 C 16 -38 16 -16 0 0 Z" fill="#f59e0b"/>
      <text y="-26" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
    </g>
    <g transform="translate(540, 700)">
      <path d="M 0 0 C -16 -16 -16 -38 0 -50 C 16 -38 16 -16 0 0 Z" fill="#ef4444"/>
      <text y="-26" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
    </g>
  </g>

  <!-- Bottom sheet -->
  <rect x="0" y="856" width="720" height="424" rx="32" fill="#ffffff"/>
  <line x1="0" y1="856" x2="720" y2="856" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="332" y="876" width="56" height="6" rx="3" fill="#cbd5e1"/>

  <!-- Smart advice in sheet -->
  <rect x="32" y="908" width="656" height="100" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="32" y="908" width="656" height="28" rx="14" fill="#2563eb"/>
  <text x="48" y="927" font-family="system-ui" font-size="11" font-weight="700" fill="#ffffff">💡 AHORRA HOY</text>
  <text x="48" y="966" font-family="system-ui" font-size="17" font-weight="700" fill="#0b1220">−4,80 € en Repsol Castilla</text>
  <text x="48" y="990" font-family="system-ui" font-size="13" fill="#64748b">2,3 km · Gasoil 1,389 €/L · Mejor opción</text>

  <!-- Stations -->
  <g font-family="system-ui">
    <rect x="32" y="1028" width="656" height="76" rx="16" fill="#ecfdf5" stroke="#86efac"/>
    <circle cx="68" cy="1066" r="20" fill="#16a34a"/>
    <text x="68" y="1072" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
    <text x="100" y="1058" font-size="15" font-weight="700" fill="#0b1220">REPSOL · Av. Castilla 12</text>
    <text x="100" y="1080" font-size="12" fill="#64748b">2,3 km · 1,389 €/L · 73,40 €</text>
    <text x="668" y="1075" font-size="12" font-weight="800" fill="#16a34a" text-anchor="end">★</text>

    <rect x="32" y="1116" width="656" height="68" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="68" cy="1150" r="20" fill="#3b82f6"/>
    <text x="68" y="1156" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
    <text x="100" y="1142" font-size="15" font-weight="700" fill="#0b1220">CEPSA · Calle Mayor 8</text>
    <text x="100" y="1164" font-size="12" fill="#64748b">3,1 km · 1,419 €/L · 75,10 €</text>

    <rect x="32" y="1196" width="656" height="68" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="68" cy="1230" r="20" fill="#f59e0b"/>
    <text x="68" y="1236" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
    <text x="100" y="1222" font-size="15" font-weight="700" fill="#0b1220">BP · Glorieta Sol</text>
    <text x="100" y="1244" font-size="12" fill="#64748b">4,5 km · 1,439 €/L · 76,20 €</text>
  </g>
</svg>
